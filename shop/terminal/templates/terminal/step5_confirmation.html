<div id="step5" class="step-container">
    <div class="step-header">ПОДТВЕРЖДЕНИЕ ЗАКАЗА</div>

    <div class="confirmation-step">
        <div class="customer-input">
            <input type="text"
                   id="customerName"
                   placeholder="Ваше ФИО">

            <input type="tel"
                   id="customerPhone"
                   placeholder="Номер телефона">
        </div>

        <div class="order-summary" id="orderSummary">
            <h3>Ваш заказ:</h3>
            <p><strong>Изделие:</strong> <span id="summaryProduct">-</span></p>
            <p><strong>Модель:</strong> <span id="summaryModel">-</span></p>
            <p><strong>Размер:</strong> <span id="summarySize">-</span></p>
            <p><strong>Принты (по зонам):</strong> <span id="summaryPrint">-</span></p>
            <p><strong>ФИО:</strong> <span id="summaryName">-</span></p>
            <p><strong>Телефон:</strong> <span id="summaryPhone">-</span></p>
        </div>

        <button id="confirmOrderBtn" onclick="submitOrder()">
            ПОДТВЕРДИТЬ ЗАКАЗ
        </button>
    </div>
</div>
