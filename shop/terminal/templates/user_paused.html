{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт приостановлен</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .pause-container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }

        .pause-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .refresh-note {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }

        .refresh-note a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="pause-container">
        <div class="pause-icon">⏸️</div>
        <h1>Аккаунт приостановлен</h1>
        <p>Ваш аккаунт был деактивирован администратором.</p>
        <p>Для возобновления работы обратитесь к администратору.</p>
        <div class="refresh-note">
            <p>Страница обновится автоматически через <span id="countdown">30</span> секунд</p>
            <p><a href="{% url 'login' %}">Вернуться на страницу входа</a></p>
        </div>
    </div>

    <script>
        // Автоматическая проверка статуса каждые 5 секунд
        let countdown = 30;
        const countdownEl = document.getElementById('countdown');

        setInterval(async function() {
            try {
                const response = await fetch('/api/check-user-status/');
                const data = await response.json();

                if (data.is_active) {
                    // Аккаунт снова активен - перезагружаем
                    window.location.href = '/login/';
                }
            } catch (error) {
                console.error('Ошибка проверки статуса:', error);
            }

            // Обновляем счетчик
            countdown--;
            if (countdownEl) countdownEl.textContent = countdown;
            if (countdown <= 0) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
