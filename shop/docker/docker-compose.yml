services:
  web:
    build:
      context: /vagrant
      dockerfile: docker/Dockerfile
    container_name: event_web
    restart: always
    expose:
      - "8000"
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - ./data/sqlite:/app/data
      - ./logs:/app/logs
      - /vagrant/terminal/static:/app/terminal/static
      - /vagrant/terminal/media:/app/terminal/media
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: event_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /vagrant/terminal/static:/static
      - /vagrant/terminal/media:/media
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge