<div id="step3" class="step-container">
    <div class="step-header">ВЫБЕРИТЕ РАЗМЕР</div>
    <div class="sizes-grid" id="sizesContainer">
        <!-- Размеры будут загружаться через JavaScript -->
        <div class="loading-message">Загрузка размеров...</div>
    </div>
</div>

<style>
.sizes-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 40px 20px;
    overflow-y: auto;
}
.size-card {
    background: #444;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px 15px;
    font-size: 1.4em;
    text-align: center;
    transition: all 0.3s ease;
    border: 3px solid transparent;
    min-height: 180px;
    cursor: pointer;
}
.size-card.selected {
    border-color: #4CAF50;
    background: #555;
    transform: scale(1.02);
}
.size-card:hover {
    background: #555;
}
.size-badge {
    font-size: 2.5em;
    font-weight: bold;
    margin-bottom: 10px;
    color: #4CAF50;
}
.size-title {
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 0.9em;
}
.size-description {
    font-size: 0.6em;
    margin-top: 5px;
    opacity: 0.8;
}
.size-price {
    font-size: 0.7em;
    color: #ffd700;
    margin-top: 5px;
    font-weight: bold;
}
.size-stock {
    font-size: 0.6em;
    color: #90ee90;
    margin-top: 3px;
}
.loading-message {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.5em;
    padding: 50px;
    color: #888;
}
.error-message {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.5em;
    padding: 50px;
    color: #ff4444;
    background: #333;
    border-radius: 15px;
}
.no-sizes-message {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.5em;
    padding: 50px;
    color: #888;
    background: #333;
    border-radius: 15px;
}
</style>

<script>
// Функция для загрузки размеров при открытии шага 3
function loadSizes() {
    if (!selectedProduct || !selectedModel) {
        document.getElementById('sizesContainer').innerHTML =
            '<div class="error-message">Ошибка: продукт или модель не выбраны</div>';
        return;
    }

    const sizesContainer = document.getElementById('sizesContainer');
    sizesContainer.innerHTML = '<div class="loading-message">Загрузка размеров...</div>';

    fetch(`/api/sizes/?product_model=${encodeURIComponent(selectedProduct.id)}&model_id=${encodeURIComponent(selectedModel.id)}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка загрузки размеров');
            }
            return response.json();
        })
        .then(sizes => {
            if (sizes.error) {
                throw new Error(sizes.error);
            }

            if (sizes.length === 0) {
                sizesContainer.innerHTML = `
                    <div class="no-sizes-message">
                        Нет доступных размеров для выбранной модели
                        <div style="font-size: 0.8em; margin-top: 10px;">Обратитесь к администратору</div>
                    </div>
                `;
                return;
            }

            let sizesHTML = '';
            sizes.forEach(sizeObj => {
                const sizeName = getSizeDisplayName(sizeObj.size);
                const stockInfo = sizeObj.quantity > 0 ?
                    `<div class="size-stock">В наличии: ${sizeObj.quantity} шт.</div>` :
                    '<div class="size-stock" style="color: #ff6b6b;">Нет в наличии</div>';

                sizesHTML += `
                    <div class="size-card" onclick="selectSize('${escapeString(sizeObj.size)}', ${sizeObj.product_id})"
                         ${sizeObj.quantity <= 0 ? 'style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                        <div class="size-badge">${sizeObj.size}</div>
                        <div class="size-title">${sizeName}</div>
                        <div class="size-price">${sizeObj.price} руб.</div>
                        ${stockInfo}
                    </div>
                `;
            });

            sizesContainer.innerHTML = sizesHTML;
        })
        .catch(error => {
            console.error('Error loading sizes:', error);
            sizesContainer.innerHTML = `
                <div class="error-message">
                    Ошибка загрузки размеров: ${error.message}
                    <br><br>
                    <button onclick="loadSizes()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Попробовать снова
                    </button>
                </div>
            `;
        });
}

// Функция для получения отображаемого названия размера
function getSizeDisplayName(size) {
    const sizeMap = {
        'XS': 'Extra Small',
        'S': 'Small',
        'M': 'Medium',
        'L': 'Large',
        'XL': 'Extra Large',
        'XXL': '2X Large',
        'XXXL': '3X Large',
        '36': 'Размер 36',
        '38': 'Размер 38',
        '40': 'Размер 40',
        '42': 'Размер 42',
        '44': 'Размер 44',
        '46': 'Размер 46',
        '48': 'Размер 48',
        '50': 'Размер 50',
        '52': 'Размер 52',
        '54': 'Размер 54',
        '56': 'Размер 56',
        '58': 'Размер 58'
    };

    return sizeMap[size] || size;
}

// Функция для экранирования строк
function escapeString(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
}

// Функция выбора размера
function selectSize(size, productId) {
    // Проверяем наличие товара
    const sizeCard = event.target.closest('.size-card');
    if (sizeCard.style.opacity === '0.5') {
        alert('Данный размер временно отсутствует в наличии');
        return;
    }

    selectedSize = {
        size: size,
        product_id: productId
    };

    // Обновляем выделение
    document.querySelectorAll('#sizesContainer .size-card').forEach(card => {
        card.classList.remove('selected');
    });

    // Находим и выделяем выбранную карточку
    document.querySelectorAll('#sizesContainer .size-card').forEach(card => {
        if (card.querySelector('.size-badge').textContent === size) {
            card.classList.add('selected');
        }
    });

    nextStep();
}

// Загружаем размеры когда шаг становится активным
document.addEventListener('DOMContentLoaded', function() {
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                const step3 = document.getElementById('step3');
                if (step3 && step3.style.display === 'flex') {
                    loadSizes();
                }
            }
        });
    });

    const step3 = document.getElementById('step3');
    if (step3) {
        observer.observe(step3, { attributes: true, attributeFilter: ['style'] });
    }
});
</script>
