<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Терминал оформления заказов</title>
    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ЭКРАН ЗАСТАВКИ */
        #screensaver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            cursor: pointer;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }

        #screensaver .instruction {
            font-size: 0.5em;
            margin-top: 20px;
            opacity: 0.8;
        }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* ШАГИ */
        .step-container {
            flex: 1;
            display: none;
            flex-direction: column;
        }

        .step-header {
            text-align: center;
            font-size: 2.5em;
            padding: 30px 20px;
            background: #333;
            border-bottom: 3px solid #555;
        }

        /* КОНТЕЙНЕРЫ Свайпа */
        .swipe-container {
            flex: 1;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 30px;
            padding: 40px 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .swipe-container::-webkit-scrollbar {
            display: none;
        }

        .swipe-item {
            flex: 0 0 85%;
            scroll-snap-align: center;
            background: #444;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 30px;
            font-size: 2em;
            text-align: center;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            min-height: 300px;
        }

        .swipe-item.selected {
            border-color: #4CAF50;
            background: #555;
            transform: scale(1.05);
        }

        .swipe-item img {
            max-width: 200px;
            max-height: 200px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        /* ШАГ ВЫБОРА ПРИНТА */
        .print-step {
            display: flex;
            height: calc(100vh - 180px);
        }

        .product-preview {
            flex: 1;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-right: 2px solid #555;
        }

        .print-area {
            position: absolute;
            border: 3px dashed #00ff00;
            background: rgba(0, 255, 0, 0.1);
            cursor: move;
        }

        .print-object {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: move;
            user-select: none;
            padding: 10px;
            border-radius: 5px;
        }

        .print-info {
            flex: 1;
            padding: 30px;
            background: #222;
            display: flex;
            flex-direction: column;
        }

        .product-details {
            margin-bottom: 30px;
        }

        .prints-gallery {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 20px 0;
            flex: 1;
        }

        .print-option {
            flex: 0 0 120px;
            height: 120px;
            background: #555;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.9em;
            text-align: center;
            padding: 10px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .print-option.selected {
            border-color: #4CAF50;
            background: #666;
        }

        .print-option.custom {
            background: #ff9800;
            color: #000;
        }

        .custom-controls {
            margin-top: 20px;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            display: none;
        }

        .custom-controls input,
        .custom-controls select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #444;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            font-size: 1.1em;
        }

        /* Добавляем label для accessibility */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ШАГ ПОДТВЕРЖДЕНИЯ */
        .confirmation-step {
            padding: 40px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }

        .customer-input {
            margin-bottom: 30px;
        }

        .customer-input input {
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            background: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 1.3em;
        }

        .notification-options {
            margin: 30px 0;
        }

        .notification-options select {
            width: 100%;
            padding: 20px;
            background: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 10px;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .order-summary {
            background: #333;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            flex: 1;
        }

        .order-summary h3 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        /* НАВИГАЦИЯ */
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 25px 30px;
            background: #333;
            border-top: 3px solid #555;
        }

        .nav-btn {
            padding: 20px 40px;
            font-size: 1.5em;
            background: #555;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            min-width: 150px;
            transition: background 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: #666;
        }

        .nav-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .nav-btn.confirm {
            background: #4CAF50;
        }

        .nav-btn.confirm:hover {
            background: #45a049;
        }

        /* ЭКРАН УСПЕХА */
        #successScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
            text-align: center;
        }

        .order-number {
            font-size: 5em;
            color: #4CAF50;
            margin: 30px 0;
            font-weight: bold;
        }

        .success-message {
            font-size: 2em;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН ЗАСТАВКИ -->
    <div id="screensaver" onclick="startApplication()">
        НАЖМИТЕ ДЛЯ РАБОТЫ
        <div class="instruction">Коснитесь экрана для начала работы</div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="app">
        <!-- ШАГ 1: ВЫБОР ИЗДЕЛИЯ -->
        <div id="step1" class="step-container">
            <div class="step-header">ВЫБЕРИТЕ ИЗДЕЛИЕ</div>
            <div class="swipe-container" id="productsContainer">
                <!-- Динамически заполняется -->
            </div>
        </div>

        <!-- ШАГ 2: ВЫБОР МОДЕЛИ -->
        <div id="step2" class="step-container">
            <div class="step-header">ВЫБЕРИТЕ МОДЕЛЬ</div>
            <div class="swipe-container" id="modelsContainer">
                <!-- Динамически заполняется -->
            </div>
        </div>

        <!-- ШАГ 3: ВЫБОР РАЗМЕРА -->
        <div id="step3" class="step-container">
            <div class="step-header">ВЫБЕРИТЕ РАЗМЕР</div>
            <div class="swipe-container" id="sizesContainer">
                <!-- Динамически заполняется -->
            </div>
        </div>

        <!-- ШАГ 4: ВЫБОР ПРИНТА -->
        <div id="step4" class="step-container">
            <div class="step-header">ВЫБЕРИТЕ ПРИНТ</div>
            <div class="print-step">
                <div class="product-preview" id="productPreview">
                    <div class="print-area" id="printArea"></div>
                    <!-- Принты добавляются сюда -->
                </div>
                <div class="print-info">
                    <div class="product-details" id="productDetails">
                        <h3>Информация о товаре</h3>
                        <p id="productInfoText">Модель: - Размер: -</p>
                    </div>
                    <div class="prints-gallery" id="printsGallery">
                        <!-- Динамически заполняется -->
                    </div>
                    <div class="custom-controls" id="customControls">
                        <label for="customText" class="visually-hidden">Введите свой текст</label>
                        <input type="text" id="customText" placeholder="Введите ваш текст" maxlength="50">
                        <label for="fontSelect" class="visually-hidden">Выберите шрифт</label>
                        <select id="fontSelect">
                            <option value="Arial">Arial</option>
                            <option value="Times">Times New Roman</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Courier">Courier New</option>
                        </select>
                        <button onclick="applyCustomText()" style="padding: 10px; margin-top: 10px;">Применить</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ШАГ 5: ПОДТВЕРЖДЕНИЕ -->
        <div id="step5" class="step-container">
            <div class="step-header">ПОДТВЕРЖДЕНИЕ ЗАКАЗА</div>
            <div class="confirmation-step">
                <div class="customer-input">
                    <label for="customerName" class="visually-hidden">Ваше ФИО</label>
                    <input type="text" id="customerName" placeholder="Ваше ФИО">
                    <label for="customerPhone" class="visually-hidden">Номер телефона</label>
                    <input type="tel" id="customerPhone" placeholder="Номер телефона">
                </div>

                <div class="notification-options">
                    <label for="notificationType" class="visually-hidden">Способ уведомления</label>
                    <select id="notificationType" onchange="toggleNotificationInput()">
                        <option value="none">Не уведомлять</option>
                        <option value="sms">SMS</option>
                        <option value="email">Email</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="telegram">Telegram</option>
                    </select>
                    <label for="notificationContact" class="visually-hidden">Контакт для уведомления</label>
                    <input type="text" id="notificationContact" placeholder="Контакт для уведомления" style="display: none;">
                </div>

                <div class="order-summary" id="orderSummary">
                    <h3>Ваш заказ:</h3>
                    <!-- Сводка заказа -->
                </div>
            </div>
        </div>

        <!-- НАВИГАЦИЯ -->
        <div class="navigation">
            <button class="nav-btn" onclick="previousStep()" id="prevBtn" disabled>НАЗАД</button>
            <button class="nav-btn" onclick="nextStep()" id="nextBtn">ДАЛЕЕ</button>
            <button class="nav-btn confirm" onclick="submitOrder()" id="confirmBtn" style="display: none;">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <!-- ЭКРАН УСПЕШНОГО ЗАКАЗА -->
    <div id="successScreen">
        <div class="success-message">Заказ успешно оформлен!</div>
        <div class="order-number" id="orderNumberDisplay">000000</div>
        <div style="font-size: 1.5em; opacity: 0.8;">Сфотографируйте номер заказа</div>
        <button class="nav-btn confirm" onclick="resetTerminal()" style="margin-top: 50px;">НОВЫЙ ЗАКАЗ</button>
    </div>

    <script>
        <!-- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ-->
        let currentStep = 1;
        let selectedProduct = null;
        let selectedModel = null;
        let selectedSize = null;
        let selectedPrint = null;
        let currentPrintObject = null;
        let inactivityTimer = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        <!--ЗАПУСК ПРИЛОЖЕНИЯ-->
        function startApplication() {
            document.getElementById('screensaver').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            showStep(1);
            resetInactivityTimer();
            loadInitialData();
        }

        <!--ТАЙМЕР НЕАКТИВНОСТИ (10 минут)-->
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                if (currentStep !== 0) { // Не показывать заставку если показан успех
                    document.getElementById('screensaver').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                    resetSelection();
                }
            }, 10 * 60 * 1000);
        }

        <!--ЗАГРУЗКА ДАННЫХ-->
        async function loadInitialData() {
            // Загрузка продуктов
            await loadProducts();
        }

        <!--НАВИГАЦИЯ-->
        function showStep(step) {
            document.querySelectorAll('.step-container').forEach(container => {
                container.style.display = 'none';
            });

            document.getElementById(`step${step}`).style.display = 'flex';

            <!--Управление кнопками навигации-->
            document.getElementById('prevBtn').disabled = step === 1;
            document.getElementById('nextBtn').style.display = step === 5 ? 'none' : 'block';
            document.getElementById('confirmBtn').style.display = step === 5 ? 'block' : 'none';

            currentStep = step;

            <!--Автопропуск шагов если один вариант-->
            autoSkipSteps();
        }

        function nextStep() {
            if (canProceedToNextStep()) {
                const nextStepNumber = getNextStepNumber();
                showStep(nextStepNumber);
                loadStepData(nextStepNumber);
            }
        }

        function previousStep() {
            const prevStepNumber = getPreviousStepNumber();
            showStep(prevStepNumber);
        }

        <!--АВТОПРОПУСК ШАГОВ-->
        function autoSkipSteps() {
            setTimeout(() => {
                if (currentStep === 1 && shouldSkipStep(2)) {
                    nextStep();
                } else if (currentStep === 2 && shouldSkipStep(3)) {
                    nextStep();
                } else if (currentStep === 3 && shouldSkipStep(4)) {
                    nextStep();
                }
            }, 100);
        }

        <<!--ЗАГРУЗКА ДАННЫХ ДЛЯ ШАГОВ-->
        async function loadStepData(step) {
            switch(step) {
                case 2:
                    await loadModels();
                    break;
                case 3:
                    await loadSizes();
                    break;
                case 4:
                    await loadPrints();
                    updateProductInfo();
                    break;
                case 5:
                    updateOrderSummary();
                    break;
            }
        }

        <!--API ФУНКЦИИ (ЗАГЛУШКИ)-->
        async function loadProducts() {
            // Заглушка - в реальности запрос к Django API
            const products = [
                { id: 1, name: 'Футболка', image: '#' },
                { id: 2, name: 'Толстовка', image: '#' },
                { id: 3, name: 'Кепка', image: '#' }
            ];
            displayProducts(products);
        }

        async function loadModels() {
            const models = [
                { id: 1, name: 'Классическая', image: '#' },
                { id: 2, name: 'Спортивная', image: '#' }
            ];
            displayModels(models);
        }

        async function loadSizes() {
            const sizes = ['S', 'M', 'L', 'XL'];
            displaySizes(sizes);
        }

        async function loadPrints() {
            const prints = [
                { id: 1, name: 'Свой текст', type: 'custom', color: '#ff9800' },
                { id: 2, name: 'Логотип 1', type: 'image' },
                { id: 3, name: 'Графика', type: 'image' },
                { id: 4, name: 'Текст принт', type: 'text' }
            ];
            displayPrints(prints);
        }

        <!--ОТОБРАЖЕНИЕ ДАННЫХ-->
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            products.forEach(product => {
                const element = createSwipeElement(product.name, product.image, () => selectProduct(product));
                container.appendChild(element);
            });
        }

        function displayModels(models) {
            const container = document.getElementById('modelsContainer');
            container.innerHTML = '';

            models.forEach(model => {
                const element = createSwipeElement(model.name, model.image, () => selectModel(model));
                container.appendChild(element);
            });
        }

        function displaySizes(sizes) {
            const container = document.getElementById('sizesContainer');
            container.innerHTML = '';

            sizes.forEach(size => {
                const element = createSwipeElement(`Размер: ${size}`, null, () => selectSize(size));
                container.appendChild(element);
            });
        }

        function displayPrints(prints) {
            const container = document.getElementById('printsGallery');
            container.innerHTML = '';

            prints.forEach(print => {
                const element = document.createElement('div');
                element.className = `print-option ${print.type === 'custom' ? 'custom' : ''}`;
                element.textContent = print.name;
                element.onclick = () => selectPrint(print);
                container.appendChild(element);
            });
        }

        function createSwipeElement(text, image, onClick) {
            const element = document.createElement('div');
            element.className = 'swipe-item';
            element.innerHTML = image ? `<img src="${image}" alt="${text}"><div>${text}</div>` : `<div>${text}</div>`;
            element.onclick = onClick;
            return element;
        }

        <!--ВЫБОР ЭЛЕМЕНТОВ-->
        function selectProduct(product) {
            selectedProduct = product;
            updateSelection('productsContainer', product.id);
            if (shouldSkipStep(2)) setTimeout(() => nextStep(), 500);
        }

        function selectModel(model) {
            selectedModel = model;
            updateSelection('modelsContainer', model.id);
            if (shouldSkipStep(3)) setTimeout(() => nextStep(), 500);
        }

        function selectSize(size) {
            selectedSize = size;
            updateSelection('sizesContainer', size);
            if (shouldSkipStep(4)) setTimeout(() => nextStep(), 500);
        }

        function selectPrint(print) {
            selectedPrint = print;
            updateSelection('printsGallery', print.id);

            if (print.type === 'custom') {
                document.getElementById('customControls').style.display = 'block';
            } else {
                document.getElementById('customControls').style.display = 'none';
                addPrintToArea(print);
            }
        }

        function updateSelection(containerId, selectedId) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.swipe-item, .print-option').forEach(item => {
                item.classList.remove('selected');
            });

            <!--Находим и выделяем выбранный элемент-->
            const elements = container.querySelectorAll('.swipe-item, .print-option');
            elements.forEach(element => {
                if (element.textContent.includes(selectedId) || element.dataset.id === selectedId) {
                    element.classList.add('selected');
                }
            });
        }

        <!--РАБОТА С ПРИНТАМИ-->
        function addPrintToArea(print) {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';

            const printObj = document.createElement('div');
            printObj.className = 'print-object';
            printObj.textContent = print.name;
            printObj.style.width = '100px';
            printObj.style.height = '50px';
            printObj.style.left = '50px';
            printObj.style.top = '50px';

            <!--Drag & Drop функциональность-->
            makeDraggable(printObj);

            printArea.appendChild(printObj);
            currentPrintObject = printObj;
        }

        function applyCustomText() {
            const text = document.getElementById('customText').value;
            const font = document.getElementById('fontSelect').value;

            if (text && selectedPrint) {
                const printArea = document.getElementById('printArea');
                printArea.innerHTML = '';

                const textObj = document.createElement('div');
                textObj.className = 'print-object';
                textObj.textContent = text;
                textObj.style.fontFamily = font;
                textObj.style.width = '150px';
                textObj.style.height = '40px';
                textObj.style.left = '50px';
                textObj.style.top = '50px';

                makeDraggable(textObj);
                printArea.appendChild(textObj);
                currentPrintObject = textObj;
            }
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            element.onmousedown = dragMouseDown;
            element.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementDragTouch;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function elementDragTouch(e) {
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX;
                pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX;
                pos4 = touch.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        <!--ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ-->
        function shouldSkipStep(step) {
            // Логика определения нужно ли пропускать шаг
            // В реальности проверять количество доступных вариантов через API
            return false;
        }

        function canProceedToNextStep() {
            switch(currentStep) {
                case 1: return selectedProduct !== null;
                case 2: return selectedModel !== null;
                case 3: return selectedSize !== null;
                case 4: return selectedPrint !== null && currentPrintObject !== null;
                case 5: return validateConfirmation();
                default: return false;
            }
        }

        function getNextStepNumber() {
            switch(currentStep) {
                case 1: return shouldSkipStep(2) ? 3 : 2;
                case 2: return shouldSkipStep(3) ? 4 : 3;
                case 3: return shouldSkipStep(4) ? 5 : 4;
                default: return currentStep + 1;
            }
        }

        function getPreviousStepNumber() {
            switch(currentStep) {
                case 3: return shouldSkipStep(2) ? 1 : 2;
                case 4: return shouldSkipStep(3) ? 2 : 3;
                case 5: return shouldSkipStep(4) ? 3 : 4;
                default: return currentStep - 1;
            }
        }

        function validateConfirmation() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            return name !== '' && phone !== '';
        }

        function updateProductInfo() {
            const infoText = `Модель: ${selectedModel?.name || '-'} | Размер: ${selectedSize || '-'}`;
            document.getElementById('productInfoText').textContent = infoText;
        }

        function updateOrderSummary() {
            const summary = document.getElementById('orderSummary');
            summary.innerHTML = `
                <h3>Ваш заказ:</h3>
                <p><strong>Изделие:</strong> ${selectedProduct?.name || '-'}</p>
                <p><strong>Модель:</strong> ${selectedModel?.name || '-'}</p>
                <p><strong>Размер:</strong> ${selectedSize || '-'}</p>
                <p><strong>Принт:</strong> ${selectedPrint?.name || '-'}</p>
                <p><strong>ФИО:</strong> ${document.getElementById('customerName').value}</p>
                <p><strong>Телефон:</strong> ${document.getElementById('customerPhone').value}</p>
            `;
        }

        function toggleNotificationInput() {
            const type = document.getElementById('notificationType').value;
            const contactInput = document.getElementById('notificationContact');
            contactInput.style.display = type === 'none' ? 'none' : 'block';
            contactInput.placeholder = type === 'email' ? 'Email адрес' :
                                     type === 'sms' ? 'Номер телефона' :
                                     'Контакт для уведомления';
        }

        // ОФОРМЛЕНИЕ ЗАКАЗА
        async function submitOrder() {
            if (!validateConfirmation()) {
                alert('Пожалуйста, заполните все обязательные поля');
                return;
            }

            const orderData = {
                product: selectedProduct,
                model: selectedModel,
                size: selectedSize,
                print: selectedPrint,
                customer_name: document.getElementById('customerName').value,
                phone: document.getElementById('customerPhone').value,
                notification_type: document.getElementById('notificationType').value,
                notification_contact: document.getElementById('notificationContact').value
            };

            try {
                // Отправка заказа на сервер
                const response = await fetch('/api/orders/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showSuccessScreen(result.order_id);
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch (error) {
                alert('Ошибка при создании заказа: ' + error.message);
            }
        }

        function showSuccessScreen(orderId) {
            document.getElementById('orderNumberDisplay').textContent = orderId;
            document.getElementById('successScreen').style.display = 'flex';
            currentStep = 0; // Чтобы таймер неактивности не сработал
        }

        function resetTerminal() {
            document.getElementById('successScreen').style.display = 'none';
            resetSelection();
            showStep(1);
            resetInactivityTimer();
        }

        function resetSelection() {
            selectedProduct = null;
            selectedModel = null;
            selectedSize = null;
            selectedPrint = null;
            currentPrintObject = null;

            // Сброс форм
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('notificationType').value = 'none';
            document.getElementById('notificationContact').value = '';
            document.getElementById('notificationContact').style.display = 'none';

            // Сброс выделений
            document.querySelectorAll('.selected').forEach(item => {
                item.classList.remove('selected');
            });
        }

        // СЛУШАТЕЛИ СОБЫТИЙ ДЛЯ СБРОСА ТАЙМЕРА НЕАКТИВНОСТИ
        document.addEventListener('click', resetInactivityTimer);
        document.addEventListener('touchstart', resetInactivityTimer);
        document.addEventListener('scroll', resetInactivityTimer);
        document.addEventListener('mousemove', resetInactivityTimer);
    </script>
</body>
</html>
