{% extends "composing/composing.html" %}
{% load static %}

{% block content %}
<div class="composing-interface">
    <h2>Добро пожаловать в интерфейс компоновки</h2>

    <div id="currentOrderContainer" class="loading">
        <!-- Здесь будет отображаться текущий заказ -->
    </div>

    <div id="controls" style="margin-top: 20px; text-align: center;">
        <button id="newOrderBtn" class="btn-primary" onclick="loadNewOrder()">
            Взять новый заказ
        </button>

        <button id="completeOrderBtn" class="btn-success" onclick="completeOrder()" style="display: none;">
            Заказ собран
        </button>

        <button id="cancelOrderBtn" class="btn-warning" onclick="cancelCurrentOrder()" style="display: none;">
            Вернуть заказ
        </button>
    </div>

    <div id="statusMessage" style="margin-top: 20px; text-align: center;"></div>
</div>
{% endblock %}
