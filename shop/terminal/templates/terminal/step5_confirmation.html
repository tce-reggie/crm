<div class="step-header">
    <div>ПОДТВЕРЖДЕНИЕ ЗАКАЗА</div>
</div>

<div class="confirmation-content">
    <!-- Информация о заказе -->
    <div class="order-summary">
        <h3>ВАШ ЗАКАЗ</h3>

        <!-- Товар -->
        <div class="summary-section">
            <h4>Товар:</h4>
            <div class="summary-item">
                <span class="label">Модель:</span>
                <span class="value" id="displayProductModel">-</span>
            </div>
            <div class="summary-item">
                <span class="label">Цвет:</span>
                <span class="value" id="displayProductColor">-</span>
            </div>
            <div class="summary-item">
                <span class="label">Размер:</span>
                <span class="value" id="displayProductSize">-</span>
            </div>
        </div>

        <!-- Принты по зонам -->
        <div class="summary-section">
            <h4>Принты:</h4>
            <div id="displayPrints">
                <!-- Здесь появятся принты -->
            </div>
        </div>
    </div>

    <div class="promocode-section">
    <h3>Промокод</h3>
    <div class="promocode-input-group">
        <input
            type="text"
            id="promocodeInput"
            placeholder="Введите промокод"
            maxlength="20"
        >
        <button
            class="btn-promocode"
            id="checkPromocodeBtn"
            onclick="checkPromocode()"
        >
            Применить
        </button>
    </div>
    <div id="promocodeMessage" class="promocode-message"></div>
    </div>

    <!-- Данные клиента -->
    <div class="customer-data">
        <h3>ВАШИ ДАННЫЕ</h3>

        <input type="text" id="customerNameInput" placeholder="ФИО" class="form-input">
        <input type="tel" id="customerPhoneInput" placeholder="Телефон" class="form-input">

    </div>
    <button class="confirm-btn" id="submitOrderBtn">
        ОФОРМИТЬ ЗАКАЗ
    </button>
</div>
